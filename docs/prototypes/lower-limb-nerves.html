<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>下肢神經與血管走向</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{

  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#2a3238; --panel:#1b2126; --ink:#e7ecef; --muted:#9aa7b0; --line:#2e373d;
    --accent:#5cc79d; --accent-soft:#1f3a30; --nerve:#f0c040; --tag:#232b31; --tag-ink:#e7ecef;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#2a3238; --panel:#1b2126; --ink:#e7ecef; --muted:#9aa7b0; --line:#2e373d;
  --accent:#5cc79d; --accent-soft:#1f3a30; --nerve:#f0c040; --tag:#232b31; --tag-ink:#e7ecef;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--panel);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;overflow:hidden}
#stage{position:relative;flex:3 1 0;min-width:0;background:var(--stage);overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:var(--tag);color:var(--tag-ink);font-size:13px;font-weight:500;line-height:1.25;padding:4px 8px;border-radius:6px;border-left:3px solid var(--c,#999);box-shadow:0 1px 4px rgba(0,0,0,.18);white-space:nowrap;transition:opacity .4s;will-change:transform}
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted)}
#legend{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink);max-width:calc(100% - 28px)}
#legend span{display:inline-flex;align-items:center;gap:6px}
#legend i{display:inline-block;width:18px;height:5px;border-radius:3px}
.tag small{display:block;color:var(--muted);font-size:11px;font-weight:400}
#panel{flex:1 1 0;min-width:290px;max-width:440px;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#panel header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#panel h1{font-size:17px;margin:0 0 2px;font-weight:700}
#panel .sub{font-size:13px;color:var(--muted)}
#modes{display:flex;gap:0;margin:12px 0 0;background:var(--line);border-radius:8px;padding:3px}
#modes button{flex:1;font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 0;border-radius:6px;cursor:pointer}
#modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#modes button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#steps{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:4px}
#steps li{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
#steps li.done{background:var(--accent);opacity:.45}
#steps li.now{background:var(--line)}
#steps li.now span{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
#body{padding:16px 20px 24px;overflow-y:auto;flex:1}
#count{font-size:13px;color:var(--muted)}
#title{font-size:22px;font-weight:700;margin:4px 0 0;line-height:1.3}
#en{font-size:14px;color:var(--muted);margin-bottom:14px}
.sec{margin:0 0 14px}
.sec h2{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 4px}
.sec p{font-size:14.5px;line-height:1.75;margin:0}
.clin{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
#body.fade{opacity:0}
#body{transition:opacity .35s}
@media (max-width:760px),(orientation:portrait) and (max-width:1000px){
  body{flex-direction:column}
  #stage{flex:none;height:56%}
  #panel{flex:1;max-width:none;min-width:0;border-left:none;border-top:1px solid var(--line)}
  #panel header{padding:10px 14px 8px}
  #panel h1{font-size:15px}
  #panel .sub,#hint{display:none}
  #modes{margin-top:8px}
  #modes button{font-size:13px;padding:5px 0}
  #steps{margin-top:8px}
  #body{padding:12px 14px 20px}
  #title{font-size:19px}
  #en{margin-bottom:10px}
  .sec p{font-size:14px;line-height:1.7}
  #legend{font-size:11px;gap:4px 10px;top:8px;left:10px}
  .tag{font-size:12px;padding:3px 7px}
  .tag small{font-size:10px}
}
</style>
</head>

</aside>

const STEP_DUR=10.5, GROW=4.2, CAM=1.8;

/* ---------- UI ---------- */
const leaders=document.getElementById('leaders');
const stepsEl=document.getElementById('steps'),bodyEl=document.getElementById('body'),tagLayer=document.getElementById('tags'),legendEl=document.getElementById('legend');
const modeBtns=[...document.querySelectorAll('#modes button')];
let tagEls=[];
function buildBars(){stepsEl.innerHTML='';MODES[mode].steps.forEach(()=>{const li=document.createElement('li');li.innerHTML='<span></span>';stepsEl.appendChild(li);});
  legendEl.innerHTML='';MODES[mode].legend.forEach(([t,c])=>{const s=document.createElement('span');const i=document.createElement('i');i.style.background=c;s.appendChild(i);s.appendChild(document.createTextNode(t));legendEl.appendChild(s);});}
function showStep(){
  const s=MODES[mode].steps[stepIdx];
  [...stepsEl.children].forEach((li,k)=>{li.className=k<stepIdx?'done':(k===stepIdx?'now':'');});
  bodyEl.classList.add('fade');
  setTimeout(()=>{
    document.getElementById('count').textContent=(stepIdx+1)+' / '+MODES[mode].steps.length;
    document.getElementById('title').textContent=s.t;
    document.getElementById('en').textContent=s.en;
    document.getElementById('where').textContent=s.where;
    document.getElementById('branches').textContent=s.br;
    document.getElementById('brH').textContent=MODES[mode].brH;
    document.getElementById('clinical').textContent=s.cl;
    bodyEl.scrollTop=0;bodyEl.classList.remove('fade');
  },300);
  tagEls.forEach(e=>{e.el.remove();e.line.remove();e.dot.remove();});
  const NS='http://www.w3.org/2000/svg';
  tagEls=s.tags.map(([zh,en,p,c])=>{const el=document.createElement('div');el.className='tag';el.appendChild(document.createTextNode(zh));
    if(en){const sm=document.createElement('small');sm.textContent=en;el.appendChild(sm);}
    el.style.setProperty('--c',c);el.style.opacity=0;tagLayer.appendChild(el);
    const line=document.createElementNS(NS,'line');line.setAttribute('stroke',c);line.setAttribute('stroke-width','1.2');line.style.transition='opacity .4s';
    const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','3');dot.setAttribute('fill',c);dot.style.transition='opacity .4s';
    leaders.appendChild(line);leaders.appendChild(dot);
    return{el,p,line,dot,w:0,h:0};});
}

/* ---------- timeline ---------- */
let mode=0,stepIdx=-1,stepT=0,growPhases=[],camFrom=[V(3.2,1.6,8.5),V(-.6,.9,-.3)],camNow=[V(3.2,1.6,8.5),V(-.6,.9,-.3)];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function resetAll(){for(const id in paths){const n=paths[id];setGrow(n,0);n.state='hidden';n.fade=0;n.flow.forEach(f=>f.visible=false);}}
function setMode(m){mode=m;resetAll();buildBars();
  document.getElementById('h1').textContent=MODES[m].name;
  modeBtns.forEach((b,k)=>b.setAttribute('aria-pressed',k===m?'true':'false'));
  startStep(0);}
function startStep(i){
  const st=MODES[mode].steps[i];
  for(const id in paths){const n=paths[id];if(n.group==='vcom')continue;
    if(n.state==='active')n.state='done';
    else if(n.state==='ctx'){n.state=n.wasDone?'done':'hidden';if(n.state==='hidden')setGrow(n,0);}}
  st.ph.flat().forEach(id=>{paths[id].state='active';});
  (st.ctx||[]).forEach(id=>{const n=paths[id];if(n.state!=='active'){n.wasDone=n.state==='done';n.state='ctx';setGrow(n,1);}});
  if(st.orbit)for(const id in paths){const n=paths[id];if(MODES[mode].groups.includes(n.group)){n.state='active';setGrow(n,1);}}
  growPhases=st.ph.filter(ph=>ph.some(id=>paths[id].p<1));
  camFrom=[camNow[0].clone(),camNow[1].clone()];
  stepIdx=i;stepT=0;showStep();
}
modeBtns.forEach((b,k)=>b.addEventListener('click',()=>setMode(k)));
let camScale=1;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?50:40;camScale=w<520?1.5:(w<820?1.25:1);camera.updateProjectionMatrix();tagEls.forEach(t=>t.w=0);}
window.addEventListener('resize',resize);resize();

const clock=new THREE.Clock(),tmp=new THREE.Vector3();
setMode(0);
function frame(){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const dt=Math.min(clock.getDelta(),.05);
  stepT+=dt;
  if(stepT>STEP_DUR){if(stepIdx+1<MODES[mode].steps.length)startStep(stepIdx+1);else setMode((mode+1)%MODES.length);}
  const s=MODES[mode].steps[stepIdx];
  const ct=ease(Math.min(stepT/CAM,1));
  const tgt=s.cam[1].clone();let pos=s.cam[0].clone();
  if(s.orbit){const off=pos.clone().sub(tgt);off.applyAxisAngle(V(0,1,0),stepT*.33);pos=tgt.clone().add(off);}
  else pos.x+=Math.sin(stepT*.4)*.25;
  pos=tgt.clone().add(pos.clone().sub(tgt).multiplyScalar(camScale));
  camNow[0].copy(camFrom[0]).lerp(pos,ct);camNow[1].copy(camFrom[1]).lerp(tgt,ct);
  camera.position.copy(camNow[0]);camera.lookAt(camNow[1]);
  const gt=Math.max(0,stepT-CAM*.6);
  const per=GROW/Math.max(growPhases.length,1);
  growPhases.forEach((ph,k)=>{const p=ease(Math.min(Math.max((gt-k*per)/per,0),1));ph.forEach(id=>setGrow(paths[id],p));});
  const tm=clock.elapsedTime;
  for(const id in paths){const n=paths[id];
    if(n.group==='vcom'){
      const a=paths[n.of];
      const target=(a.p>=1&&a.state!=='hidden')?(a.state==='active'?1:(a.state==='ctx'?.45:.6)):0;
      n.fade+=(target-n.fade)*Math.min(dt*2.5,1);
      if(n.fade>.01&&n.p<1)setGrow(n,1);
      if(n.fade<=.01&&n.p>0){setGrow(n,0);}
      n.head.visible=false;
      n.mesh.material.opacity=.6*n.fade;n.mesh.material.emissiveIntensity=.2;
      const fo=a.state==='active'&&n.fade>.5;
      n.flow.forEach((f,i)=>{f.visible=fo;if(fo){const u=(tm*0.7/n.len+f.userData.o+i/n.flow.length)%1;f.position.copy(n.curve.getPointAt(u));f.material.opacity=.7*n.fade;}});
      continue;}
    const on=n.state==='active',done=n.state==='done',ctx=n.state==='ctx';
    if((done||ctx)&&n.p<1)setGrow(n,1);
    n.mesh.material.opacity=on?1:(done?.45:(ctx?.3:0));
    n.mesh.material.emissiveIntensity=on?.45:.12;
    const flowOn=on&&n.p>=1;
    n.flow.forEach((f,i)=>{f.visible=flowOn;if(flowOn){const u=(tm*0.9/n.len+f.userData.o+i/n.flow.length)%1;f.position.copy(n.curve.getPointAt(u));}});
  }
  for(const k in muscles){const m=muscles[k];const want=(s.mus||[]).includes(k)?1:0;
    m.userData.t+=(want-m.userData.t)*Math.min(dt*3,1);
    m.material.opacity=.08+m.userData.t*.42;m.material.emissiveIntensity=m.userData.t*.25;}
  pirifMat.opacity=s.pir?.75:.3;
  renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  // label layout: place each tag above its anchor, then push apart so none overlap
  const boxes=[];
  tagEls.forEach((t,i)=>{tmp.copy(t.p).project(camera);
    const ax=(tmp.x*.5+.5)*w,ay=(-tmp.y*.5+.5)*h;
    const vis=tmp.z<1&&stepT>CAM*.7+i*.4;
    if(!t.w){t.w=t.el.offsetWidth;t.h=t.el.offsetHeight;}
    let x=Math.min(Math.max(ax-t.w/2,6),w-t.w-6),y=ay-t.h-18;
    boxes.push({t,ax,ay,x,y,vis});});
  boxes.sort((a,b)=>a.y-b.y);
  for(let it=0;it<6;it++){for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){
    const a=boxes[i],b=boxes[j];
    const ox=Math.min(a.x+a.t.w,b.x+b.t.w)-Math.max(a.x,b.x),oy=Math.min(a.y+a.t.h,b.y+b.t.h)-Math.max(a.y,b.y);
    if(ox>0&&oy>0){const d=(oy+4)/2;a.y-=d;b.y+=d;}}}
  boxes.forEach(b=>{b.y=Math.min(Math.max(b.y,legendEl.offsetHeight+14),h-b.t.h-6);
    b.t.el.style.transform='translate('+b.x.toFixed(1)+'px,'+b.y.toFixed(1)+'px)';
    b.t.el.style.opacity=b.vis?1:0;
    const cx=Math.min(Math.max(b.ax,b.x+6),b.x+b.t.w-6),cy=b.y+(b.ay>b.y?b.t.h:0);
    b.t.line.setAttribute('x1',b.ax);b.t.line.setAttribute('y1',b.ay);b.t.line.setAttribute('x2',cx);b.t.line.setAttribute('y2',cy);
    b.t.dot.setAttribute('cx',b.ax);b.t.dot.setAttribute('cy',b.ay);
    b.t.line.style.opacity=b.t.dot.style.opacity=b.vis?.9:0;});
  const now=stepsEl.children[stepIdx];if(now)now.firstChild.style.transform='scaleX('+Math.min(stepT/STEP_DUR,1)+')';
}
frame();
})();
</script>
