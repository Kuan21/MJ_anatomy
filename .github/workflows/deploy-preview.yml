name: Deploy MJ Anatomy Preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, mj-stability-checks]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pinned upstream files (checked by sha256 in the prepare scripts) are cached so a build does not depend on raw.githubusercontent.com every time.
      # The cache is private to this repository; the files are not redistributed.
      - uses: actions/cache@v4
        with:
          path: |
            work/heart-source.glb
            work/facial.bin
            work/supplement/*.stl
            public/models/brain.glb
          key: pinned-downloads-${{ hashFiles('scripts/heart-parts.json', 'scripts/prepare-heart.mjs', 'scripts/prepare-facial.mjs', 'scripts/prepare-supplement.mjs', 'scripts/supplement-parts.json', 'scripts/prepare-brain.mjs') }}
      - run: npm run check
      - run: npm run check:motion
      - run: npm run check:vessels
      - run: npm run check:vessels:accept
      - run: npm run build -- --base /MJ_anatomy/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
