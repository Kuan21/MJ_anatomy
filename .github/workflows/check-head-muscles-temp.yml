name: Temporary head-muscle systems validation
on:
  push:
    branches: [ui/head-muscles-in-systems-20260923]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --base /MJ_anatomy/
