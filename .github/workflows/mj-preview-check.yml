name: MJ Anatomy Preview Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [mj-upper-limb-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:upper-limb
      - run: npm run check
      - run: npm run build
