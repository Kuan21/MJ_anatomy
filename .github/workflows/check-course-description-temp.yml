name: Temporary course-description validation
on:
  push:
    branches: [data/cmu-course-notes-full-descriptions-20260924]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --base /MJ_anatomy/
